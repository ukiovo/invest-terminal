name: Supabase Keepalive

# 每天自动向 Supabase 发一个轻量查询，避免免费项目因 7 天无活动被暂停。
# 用的是前端同款 publishable key（公开安全，配合 RLS）。

on:
  schedule:
    - cron: '17 3 * * *'   # 每天 UTC 03:17（约北京时间 11:17）运行一次
  workflow_dispatch: {}      # 也可在 Actions 页手动点 Run 立即测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          echo "Pinging Supabase to keep the project active..."
          curl --fail -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://rrnxrpowezukxrobcanl.supabase.co/rest/v1/trades?select=id&limit=1" \
            -H "apikey: sb_publishable_fYga6xuLrwaCGX9MJ3m-0A_e5Auq8gU" \
            -H "Authorization: Bearer sb_publishable_fYga6xuLrwaCGX9MJ3m-0A_e5Auq8gU"
          echo "Done."
